<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANTRA-WEB Device Preview</title>
<style>
:root{color-scheme:dark;--cyan:#4fe3ff;--ink:#05070c;--muted:#8a97ab}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#12384a,#05070c 42%);color:#eef6fa;font:14px Inter,Arial,sans-serif;min-height:100vh}
.board{max-width:1500px;margin:auto;padding:34px 24px 60px}.heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}.eyebrow{color:var(--cyan);font:11px monospace;letter-spacing:2px}.heading h1{font:600 clamp(30px,5vw,64px)/1 Space Grotesk,Arial;margin:10px 0 0;letter-spacing:-2px}.heading p{color:var(--muted);max-width:390px;line-height:1.6;margin:0}
.devices{display:flex;align-items:flex-end;justify-content:center;gap:28px;flex-wrap:wrap}.device{background:#101923;border:1px solid #294355;box-shadow:0 22px 70px #0008,0 0 35px #4fe3ff12;padding:11px;border-radius:22px}.device-label{text-align:center;color:var(--cyan);font:10px monospace;letter-spacing:1.5px;margin:0 0 10px}
/* .screen is the on-page display box; the iframe inside is rendered at the
   REAL target viewport size (data-w/data-h) and scaled down with a CSS
   transform, so the page inside genuinely experiences that viewport width
   and hits the correct breakpoints — instead of being squeezed into a
   viewport narrower than the label claims. */
.screen{background:#05070c;overflow:hidden;border-radius:13px;position:relative}.screen iframe{display:block;border:0;background:#05070c;position:absolute;top:0;left:0;transform-origin:top left}
.desktop{width:min(860px,100%)}.desktop .screen{height:480px}.tablet{width:390px}.tablet .screen{height:500px}.phone{width:230px;border-radius:28px}.phone .screen{height:470px;border-radius:18px}
@media(max-width:700px){.board{padding:24px 14px 40px}.heading{display:block}.heading p{margin-top:14px}.devices{gap:18px}.desktop{width:100%}.desktop .screen{height:300px}.tablet{width:calc(68% - 9px);min-width:250px}.tablet .screen{height:380px}.phone{width:calc(32% - 9px);min-width:150px}.phone .screen{height:380px}}
</style>
</head>
<body>
<main class="board">
<header class="heading"><div><div class="eyebrow">ANTRA-WEB · RESPONSIVE PREVIEW</div><h1>One identity.<br>Every screen.</h1></div><p>Live previews of the repaired homepage composition across desktop, tablet, and mobile proportions.</p></header>
<section class="devices">
  <article class="device desktop"><div class="device-label">DESKTOP · 1440 × 900</div><div class="screen" data-w="1440" data-h="900"><iframe src="index.html" title="ANTRA-WEB desktop preview"></iframe></div></article>
  <article class="device tablet"><div class="device-label">TABLET · 834 × 1194</div><div class="screen" data-w="834" data-h="1194"><iframe src="index.html" title="ANTRA-WEB tablet preview"></iframe></div></article>
  <article class="device phone"><div class="device-label">PHONE · 390 × 844</div><div class="screen" data-w="390" data-h="844"><iframe src="index.html" title="ANTRA-WEB phone preview"></iframe></div></article>
</section>
</main>
<script>
// Renders each iframe at its REAL device viewport width (data-w), then
// scales the whole thing down to fit the visible box. This means the site
// inside genuinely hits phone/tablet/desktop breakpoints correctly, rather
// than being rendered at whatever odd pixel width the box happens to be.
(function(){
  function layout(){
    document.querySelectorAll('.screen').forEach(function(screen){
      var w = parseFloat(screen.dataset.w), h = parseFloat(screen.dataset.h);
      var iframe = screen.querySelector('iframe');
      var boxW = screen.clientWidth, boxH = screen.clientHeight;
      var scale = boxW / w;
      iframe.style.width = w + 'px';
      iframe.style.height = h + 'px';
      iframe.style.transform = 'scale(' + scale + ')';
      // Show a full first-viewport slice: the visible box maps to (boxH/scale) px of real page height.
    });
  }
  layout();
  window.addEventListener('load', layout);
  window.addEventListener('resize', layout);
})();
</script>
</body>
</html>
